[project]
name = "mlzoomcamp-2026"
version = "0.1.0"
description = "Machine Learning Zoomcamp 2026 - exercicios e atividades"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.5",
    "pyarrow>=17.0",
    "requests>=2.32",
    "httpx>=0.27",
    "tqdm>=4.66",
    "jupyterlab>=4.2",
    "notebook>=7.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
deploy = [
    "flask>=3.0",
    "gunicorn>=22.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "boto3>=1.34",
    "mlflow>=2.15",
]
ml = [
    "xgboost>=2.1",
    "lightgbm>=4.4",
]
dl = [
    "tensorflow>=2.17",
    "torch>=2.4",
]
dev = [
    "ruff>=0.6",
    "black>=24.4",
    "isort>=5.13",
    "pytest>=8.3",
    "pre-commit>=3.7",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
